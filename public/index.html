<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이용 안내</title>
  <style>
    :root { --bg:#f7f8fa; --card:#fff; --text:#1c1f26; --sub:#5b6270; --accent:#2f6bff; --line:#e4e7ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12141a; --card:#1b1e26; --text:#eef0f4; --sub:#9aa2b1; --accent:#6b94ff; --line:#2b2f3a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); line-height:1.75; }
    main { max-width:760px; margin:0 auto; padding:40px 16px 64px; }
    h1 { font-size:1.8rem; margin:0 0 6px; }
    .lead { color:var(--sub); margin:0 0 20px; }

    /* 슬라이더: transform 으로 카드 이동 (스냅 미사용) */
    .viewport { overflow:hidden; border-radius:16px; touch-action:pan-y; user-select:none; cursor:grab; }
    .viewport.drag { cursor:grabbing; }
    .track { display:flex; align-items:flex-start; transition:transform .35s ease; will-change:transform; }
    .track.nodrag { transition:none; }
    .card { flex:0 0 100%; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
    .card h2 { font-size:1.2rem; margin:0 0 12px; display:flex; align-items:center; gap:10px; }
    .num { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-size:.9rem; flex:none; }
    .card ul { margin:6px 0 12px; padding-left:1.2rem; }
    .card li { margin:6px 0; }
    .imgs { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
    .imgs img { flex:1 1 160px; max-width:100%; -webkit-user-drag:none; border-radius:10px; border:1px solid var(--line); }
    .btn { display:inline-block; padding:12px 20px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }

    /* 좌우 화살표 */
    .nav { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1.2rem; cursor:pointer; z-index:2; }
    .nav.prev { left:-12px; } .nav.next { right:-12px; }
    .nav:disabled { opacity:.3; cursor:default; }
    @media (max-width:800px) { .nav.prev { left:4px; } .nav.next { right:4px; } }

    /* 하단 점 표시 */
    .dots { display:flex; justify-content:center; gap:8px; margin-top:16px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--line); border:0; padding:0; cursor:pointer; }
    .dot.on { background:var(--accent); }
    footer { color:var(--sub); font-size:.85rem; margin-top:28px; text-align:center; }
  </style>
</head>
<body>
<main>
  <h1 id="title">이용 안내</h1>
  <p class="lead">좌우로 넘기며 순서대로 확인해 주세요.</p>

  <div class="slider">
    <button class="nav prev" aria-label="이전">‹</button>
    <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
    <button class="nav next" aria-label="다음">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <footer>© <span id="year"></span> <span id="name"></span></footer>
</main>

<script>
  // ✏️ 카드 내용은 여기만 수정하세요.
  //  - images: public/img/ 에 올린 파일명 (여러 장 가능, 없으면 빈 배열)
  //  - button: { label, key } → key 는 서버 config(/config.json)의 키 이름 (contactUrl, surveyUrl)
  const steps = [
    { title: "(1단계 제목)",
      bullets: ["(안내 문구 1)", "(안내 문구 2)"],
      images: ["step1.png"],
      button: { label: "문의하기", key: "contactUrl" } },
    { title: "(2단계 제목)",
      bullets: ["(안내 문구 1)", "(안내 문구 2)", "(안내 문구 3)"],
      images: [],
      button: { label: "바로가기", key: "surveyUrl" } },
    { title: "(3단계 제목)",
      bullets: ["(안내 문구 1)", "(안내 문구 2)", "(안내 문구 3)"],
      images: ["step3-1.png", "step3-2.png", "step3-3.png"] },
    { title: "(4단계 제목)",
      images: ["step4.png"],            // 제목 바로 아래에 그림
      bullets: ["(안내 문구 1)", "(안내 문구 2)"] }, // 그림 아래에 글
  ];

  const $ = (id) => document.getElementById(id);
  const track = $("track"), dots = $("dots");
  const prev = document.querySelector(".prev"), next = document.querySelector(".next");

  // 카드 렌더링 (이미지 파일이 없으면 자동으로 숨김)
  const render = (cfg) => {
    track.innerHTML = steps.map((s, i) => `
      <article class="card">
        <h2><span class="num">${i + 1}</span>${s.title}</h2>
        ${i === steps.length - 1 ? imgs(s) : ""}
        <ul>${(s.bullets ?? []).map((b) => `<li>${b}</li>`).join("")}</ul>
        ${i === steps.length - 1 ? "" : imgs(s)}
        ${s.button && cfg[s.button.key]
          ? `<a class="btn" href="${cfg[s.button.key]}" target="_blank" rel="noopener noreferrer">${s.button.label}</a>` : ""}
      </article>`).join("");
    dots.innerHTML = steps.map((_, i) => `<button class="dot" aria-label="${i + 1}단계" data-i="${i}"></button>`).join("");
    update();
  };
  const imgs = (s) => s.images?.length
    ? `<div class="imgs">${s.images.map((f) => `<img src="img/${f}" alt="" onerror="this.remove()">`).join("")}</div>` : "";

  // 현재 카드 번호를 직접 관리 (cur) → translateX 로 이동
  let cur = 0;
  const vp = $("viewport");
  const clamp = (i) => Math.max(0, Math.min(steps.length - 1, i));
  const go = (i) => { cur = clamp(i); track.style.transform = `translateX(${-cur * 100}%)`; update(); };
  const update = () => {
    prev.disabled = cur <= 0; next.disabled = cur >= steps.length - 1;
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === cur));
  };
  prev.onclick = () => go(cur - 1);
  next.onclick = () => go(cur + 1);
  dots.onclick = (e) => e.target.dataset.i && go(+e.target.dataset.i);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(cur - 1);
    if (e.key === "ArrowRight") go(cur + 1);
  });

  // 터치/마우스 드래그 스와이프 (Pointer Events 하나로 처리)
  let startX = 0, dx = 0, dragging = false;
  vp.addEventListener("pointerdown", (e) => {
    if (e.target.closest("a,button")) return;       // 버튼/링크 클릭은 방해하지 않음
    dragging = true; startX = e.clientX; dx = 0;
    track.classList.add("nodrag"); vp.classList.add("drag");
  });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    track.style.transform = `translateX(calc(${-cur * 100}% + ${dx}px))`;
  });
  window.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false; track.classList.remove("nodrag"); vp.classList.remove("drag");
    go(Math.abs(dx) > 50 ? cur + (dx < 0 ? 1 : -1) : cur);   // 50px 이상 끌면 넘김
  });
  window.addEventListener("pointercancel", () => { if (dragging) { dragging = false; track.classList.remove("nodrag"); go(cur); } });

  // 서버 설정(/config.json) 로드 후 렌더링
  (async () => {
    let cfg = {};
    try { cfg = await (await fetch("/config.json")).json(); } catch (e) { console.error(e); }
    if (cfg.siteName) { document.title = cfg.siteName; $("title").textContent = cfg.siteName; $("name").textContent = cfg.siteName; }
    $("year").textContent = new Date().getFullYear();
    render(cfg);
  })();
</script>
</body>
</html>
